name: Release and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: github.ref_type == 'branch'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: github.ref_type == 'branch'
        run: npm ci

      - name: Create GitHub release
        if: github.ref_type == 'branch'
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run release
          git fetch --tags origin
          tag="$(git tag --points-at "$GITHUB_SHA" --sort=-version:refname | head -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Select image tag
        id: image-tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image-tag.outputs.tag != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.image-tag.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: steps.image-tag.outputs.tag != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.image-tag.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.image-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.image-tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.image-tag.outputs.tag }}

      - name: Build and push image
        if: steps.image-tag.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT=${{ github.sha }}
